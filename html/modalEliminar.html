<section id="container-principal" class="form-information">
    <div class="form-panel">
        <button class="close-btn" id="btn-close">✕</button>
        
        <div class="info-top">
            <div class="wish-img-wrap">
                <img class="wish-img" id="pokemonModal-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu">
            </div>
            <div class="poke-info">
                <div id="pokemonModal-title" class="wish-name">Pikachu</div>
                <div id="pokemonModal-id" class="wish-id">#025</div>
            </div>
        </div>

        <div class="info-bottom">
            <div class="modal-text-content">
            <h3 >¿Estás seguro de eliminar este registro?</h3>

        </div>

        <div class="form-actions">
            <button class="btn-save" id="btn-confirm-delete">Eliminar</button>

        </div>
        </div>
    </div>
